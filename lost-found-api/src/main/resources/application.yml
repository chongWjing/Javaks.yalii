spring:
  datasource:
    url: jdbc:mysql://localhost:3306/javaks?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: '123456'
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5

  jpa:
    open-in-view: true
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  jackson:
    serialization:
      write-dates-as-timestamps: false

# JWT Configuration
jwt:
  secret: LostFoundSecretKeyForJWTTokenGeneration2024VeryLongAndSecureKey
  expiration: 86400000  # 24 hours in milliseconds

# Server Configuration
server:
  port: 8080

# Logging
logging:
  level:
    com.lostfound: DEBUG
    org.hibernate.SQL: DEBUG
