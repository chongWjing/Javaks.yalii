spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:3306/${DB_NAME:javaks2}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USER:root}
    password: '${DB_PASSWORD:123456}'
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5

  jpa:
    open-in-view: true
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  jackson:
    serialization:
      write-dates-as-timestamps: false
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 20MB

# JWT Configuration
jwt:
  secret: LostFoundSecretKeyForJWTTokenGeneration2024VeryLongAndSecureKey
  expiration: 86400000  # 24 hours in milliseconds

app:
  upload-dir: ${user.dir}/uploads

# Server Configuration
server:
  port: 8080

# Logging
logging:
  level:
    com.lostfound: DEBUG
    org.hibernate.SQL: DEBUG
